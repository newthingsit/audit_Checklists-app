name: Azure App Service CI/CD - Backend

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/azure-app-service.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/azure-app-service.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'audit-app-backend-2221'
  AZURE_RESOURCE_GROUP: 'audit-app-rg'
  NODE_VERSION: '22.x'

concurrency:
  group: azure-app-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Backend
    if: github.actor != 'dependabot[bot]'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend production dependencies
        run: |
          cd backend
          npm ci --omit=dev --no-audit --no-fund
          npm ls express
          echo "✅ Production dependencies installed"

      - name: Create deployment package
        run: |
          cd backend
          # Package source code WITH production node_modules
          # This avoids runtime failures when Oryx build is skipped on App Service
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "web.config" \
            -x "*.md" \
            -x "tests/*" \
            -x "*.test.js"

          echo "✅ Deployment package created (includes production node_modules)"
          ls -lh ../backend.zip

      - name: Validate deployment artifact integrity
        run: |
          set -e
          echo "🔍 Validating backend.zip contents..."

          unzip -l backend.zip | grep -q "server.js" || { echo "❌ server.js missing in backend.zip"; exit 1; }
          unzip -l backend.zip | grep -q "package.json" || { echo "❌ package.json missing in backend.zip"; exit 1; }
          unzip -l backend.zip | grep -q "node_modules/express/" || { echo "❌ express dependency missing in backend.zip"; exit 1; }
          unzip -l backend.zip | grep -q "node_modules/@opentelemetry/sdk-trace-node/" || { echo "❌ OpenTelemetry sdk-trace-node missing in backend.zip"; exit 1; }

          echo "✅ backend.zip integrity checks passed"

      - name: 'Azure Login'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Configure App Service settings'
        run: |
          # Check current settings to avoid unnecessary restart
          CURRENT=$(az webapp config appsettings list \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --query "[?name=='SCM_DO_BUILD_DURING_DEPLOYMENT'].value | [0]" -o tsv 2>/dev/null || echo '')

          if [ "$CURRENT" = "false" ]; then
            echo "✅ SCM_DO_BUILD_DURING_DEPLOYMENT already set to false — skipping (no SCM restart needed)"
          else
            echo "Setting SCM_DO_BUILD_DURING_DEPLOYMENT=false..."
            az webapp config appsettings set \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              --output none
            echo "✅ App setting updated — waiting 90s for SCM container to stabilize after restart..."
            sleep 90
          fi

      - name: 'Deploy to Azure Web App (async + poll)'
        run: |
          set -e

          APP_NAME="${{ env.AZURE_WEBAPP_NAME }}"
          RG_NAME="${{ env.AZURE_RESOURCE_GROUP }}"

          echo "Deploying backend.zip to app '$APP_NAME' in resource group '$RG_NAME'"

          MAX_ATTEMPTS=4
          ATTEMPT=1
          SUCCESS=0

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "🚀 Deploy attempt $ATTEMPT/$MAX_ATTEMPTS"

            set +e
            DEPLOY_OUTPUT=$(az webapp deploy \
              --resource-group "$RG_NAME" \
              --name "$APP_NAME" \
              --src-path backend.zip \
              --type zip \
              --clean true \
              --async true 2>&1)
            EXIT_CODE=$?
            set -e

            echo "$DEPLOY_OUTPUT"

            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Deployment package pushed successfully (async)"
              SUCCESS=1
              break
            fi

            if echo "$DEPLOY_OUTPUT" | grep -Eqi "Conflict|409|another operation|deployment in progress|SCM container restart|stopped due to SCM"; then
              WAIT_SECONDS=$((ATTEMPT * 60))
              echo "⚠️ OneDeploy conflict / SCM restart detected. Waiting ${WAIT_SECONDS}s before retry..."
              sleep "$WAIT_SECONDS"
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            if echo "$DEPLOY_OUTPUT" | grep -Eqi "504|GatewayTimeout|Gateway Timeout|502|503|timed out|timeout|failed to start|worker proccess failed"; then
              WAIT_SECONDS=$((ATTEMPT * 60))
              echo "⚠️ Transient error detected (gateway/timeout/startup). Retrying in ${WAIT_SECONDS}s..."
              sleep "$WAIT_SECONDS"
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            echo "❌ Deployment failed with non-retryable error"
            exit $EXIT_CODE
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ Deployment failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: 'Poll deployment until complete'
        run: |
          set -e
          APP_NAME="${{ env.AZURE_WEBAPP_NAME }}"
          RG_NAME="${{ env.AZURE_RESOURCE_GROUP }}"
          SCM_HOST="${APP_NAME}.scm.azurewebsites.net"

          echo "⏳ Polling deployment status (up to 5 minutes)..."
          for i in $(seq 1 20); do
            STATUS_JSON=$(az rest \
              --method get \
              --url "https://${SCM_HOST}/api/deployments/latest" \
              --resource "https://management.azure.com/" 2>/dev/null || echo '{}')

            COMPLETE=$(echo "$STATUS_JSON" | jq -r '.complete // false')
            STATUS=$(echo "$STATUS_JSON" | jq -r '.status // "unknown"')
            PROGRESS=$(echo "$STATUS_JSON" | jq -r '.progress // "N/A"')

            echo "  Poll $i/20: complete=$COMPLETE status=$STATUS progress=$PROGRESS"

            if [ "$COMPLETE" = "true" ]; then
              if [ "$STATUS" = "4" ]; then
                echo "✅ Deployment completed successfully"
                exit 0
              else
                echo "❌ Deployment completed with failure (status=$STATUS)"
                exit 1
              fi
            fi

            sleep 15
          done

          echo "⚠️ Deployment did not complete within polling window — proceeding to health check"

      - name: 'Wait for app warm-up'
        if: always()
        run: |
          echo "⏳ Waiting for app warm-up..."
          sleep 45

      - name: 'Verify deployment'
        if: always()
        run: |
          echo "🔍 Testing health endpoint(s)..."

          APP_NAME="${{ env.AZURE_WEBAPP_NAME }}"
          RG_NAME="${{ env.AZURE_RESOURCE_GROUP }}"
          PRIMARY_HOST="${APP_NAME}.azurewebsites.net"

          # Resolve actual hostname from Azure (may differ from short name)
          RESOLVED_HOST=$(az webapp show --name "$APP_NAME" --resource-group "$RG_NAME" --query "defaultHostName" -o tsv 2>/dev/null || true)

          # Build host list: prefer resolved host first (short name may not resolve in all DNS)
          declare -a HOSTS=()
          if [ -n "$RESOLVED_HOST" ] && [ "$RESOLVED_HOST" != "null" ]; then
            HOSTS+=("$RESOLVED_HOST")
          fi
          if [ "$RESOLVED_HOST" != "$PRIMARY_HOST" ]; then
            HOSTS+=("$PRIMARY_HOST")
          fi

          echo "Candidate hosts: ${HOSTS[*]}"

          for host in "${HOSTS[@]}"; do
            if [ -z "$host" ]; then
              continue
            fi

            echo "Checking host: $host"
            for i in {1..12}; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "https://$host/api/health" 2>/dev/null || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "✅ Backend is healthy on https://$host/api/health"
                exit 0
              fi
              # If DNS can't resolve this host, skip to the next one
              if [ "$CODE" = "000" ] && [ "$i" -ge 2 ]; then
                echo "⚠️ Host $host unreachable after $i attempts — trying next host"
                break
              fi
              echo "Attempt $i/12 on $host returned HTTP $CODE, waiting 15s..."
              sleep 15
            done
          done

          echo "❌ Health check failed for all candidate hosts"
          for host in "${HOSTS[@]}"; do
            if [ -n "$host" ]; then
              echo "--- Diagnostics for $host ---"
              curl -I -s --connect-timeout 10 "https://$host/api/health" 2>/dev/null || true
              curl -I -s --connect-timeout 10 "https://$host/" 2>/dev/null || true
            fi
          done

          exit 1


