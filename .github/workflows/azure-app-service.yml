name: Azure App Service CI/CD - Backend

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/azure-app-service.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/azure-app-service.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'audit-app-backend-2221'
  NODE_VERSION: '22.x'

concurrency:
  group: azure-app-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Backend
    if: github.actor != 'dependabot[bot]'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend production dependencies
        run: |
          cd backend
          npm ci --omit=dev --no-audit --no-fund
          npm ls express
          echo "✅ Production dependencies installed"

      - name: Create deployment package
        run: |
          cd backend
          # Package source code WITH production node_modules
          # This avoids runtime failures when Oryx build is skipped on App Service
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "web.config" \
            -x "*.md" \
            -x "tests/*" \
            -x "*.test.js"

          echo "✅ Deployment package created (includes production node_modules)"
          ls -lh ../backend.zip

      - name: Validate deployment artifact integrity
        run: |
          set -e
          echo "🔍 Validating backend.zip contents..."

          unzip -l backend.zip | grep -q "server.js" || { echo "❌ server.js missing in backend.zip"; exit 1; }
          unzip -l backend.zip | grep -q "package.json" || { echo "❌ package.json missing in backend.zip"; exit 1; }
          unzip -l backend.zip | grep -q "node_modules/express/" || { echo "❌ express dependency missing in backend.zip"; exit 1; }
          unzip -l backend.zip | grep -q "node_modules/@opentelemetry/sdk-trace-node/" || { echo "❌ OpenTelemetry sdk-trace-node missing in backend.zip"; exit 1; }

          echo "✅ backend.zip integrity checks passed"

      - name: 'Azure Login'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Stabilize SCM before deploy'
        run: |
          echo "Waiting briefly to avoid SCM restart/deploy overlap..."
          sleep 45

      - name: 'Deploy to Azure Web App (conflict-aware retry)'
        run: |
          set -e

          APP_NAME="${{ env.AZURE_WEBAPP_NAME }}"
          RG_NAME=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
          if [ -z "$RG_NAME" ] || [ "$RG_NAME" = "null" ]; then
            echo "❌ Could not resolve resource group for app '$APP_NAME'"
            az webapp list --query "[].{name:name,resourceGroup:resourceGroup}" -o table || true
            exit 1
          fi

          echo "Deploying backend.zip to app '$APP_NAME' in resource group '$RG_NAME'"

          MAX_ATTEMPTS=6
          ATTEMPT=1
          SUCCESS=0

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "🚀 Deploy attempt $ATTEMPT/$MAX_ATTEMPTS"

            set +e
            DEPLOY_OUTPUT=$(az webapp deploy \
              --resource-group "$RG_NAME" \
              --name "$APP_NAME" \
              --src-path backend.zip \
              --type zip \
              --clean true 2>&1)
            EXIT_CODE=$?
            set -e

            echo "$DEPLOY_OUTPUT"

            if [ $EXIT_CODE -eq 0 ]; then
              SUCCESS=1
              echo "✅ Deployment command succeeded"
              break
            fi

            if echo "$DEPLOY_OUTPUT" | grep -Eqi "Conflict|409|another operation|deployment in progress"; then
              WAIT_SECONDS=$((ATTEMPT * 45))
              echo "⚠️ OneDeploy conflict detected. Restarting app and retrying in ${WAIT_SECONDS}s..."
              az webapp restart --resource-group "$RG_NAME" --name "$APP_NAME" || true
              sleep "$WAIT_SECONDS"
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            echo "❌ Deployment failed with non-retryable error"
            exit $EXIT_CODE
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ Deployment failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: 'Wait for Azure Oryx build and startup'
        if: always()
        run: |
          echo "⏳ Waiting for app restart and warm-up..."
          sleep 120

      - name: 'Verify deployment'
        if: always()
        run: |
          echo "🔍 Testing health endpoint(s)..."

          APP_NAME="${{ env.AZURE_WEBAPP_NAME }}"
          PRIMARY_HOST="${APP_NAME}.azurewebsites.net"
          declare -a HOSTS=("$PRIMARY_HOST")

          RESOLVED_HOST=$(az webapp list --query "[?name=='$APP_NAME'].defaultHostName | [0]" -o tsv 2>/dev/null || true)
          if [ -n "$RESOLVED_HOST" ] && [ "$RESOLVED_HOST" != "null" ] && [ "$RESOLVED_HOST" != "$PRIMARY_HOST" ]; then
            HOSTS+=("$RESOLVED_HOST")
          fi

          APP_URL_HOST=$(az webapp list --query "[?name=='$APP_NAME'].defaultHostName | [0]" -o tsv 2>/dev/null || true)
          if [ -n "$APP_URL_HOST" ] && [ "$APP_URL_HOST" != "null" ] && [ "$APP_URL_HOST" != "$PRIMARY_HOST" ] && [ "$APP_URL_HOST" != "$RESOLVED_HOST" ]; then
            HOSTS+=("$APP_URL_HOST")
          fi

          echo "Candidate hosts: ${HOSTS[*]}"

          for host in "${HOSTS[@]}"; do
            if [ -z "$host" ]; then
              continue
            fi

            echo "Checking host: $host"
            for i in {1..12}; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$host/api/health")
              if [ "$CODE" = "200" ]; then
                echo "✅ Backend is healthy on https://$host/api/health"
                exit 0
              fi
              echo "Attempt $i/12 on $host returned HTTP $CODE, waiting 30s..."
              sleep 30
            done
          done

          echo "❌ Health check failed for all candidate hosts"
          for host in "${HOSTS[@]}"; do
            if [ -n "$host" ]; then
              echo "--- Diagnostics for $host ---"
              curl -I -s "https://$host/api/health" || true
              curl -I -s "https://$host/" || true
            fi
          done

          exit 1


