name: Azure App Service CI/CD - Backend

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'audit-app-backend-2221'
  NODE_VERSION: '22.x'

concurrency:
  group: azure-app-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Backend
    if: github.actor != 'dependabot[bot]'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create deployment package
        run: |
          cd backend
          # Package source code WITHOUT node_modules
          # Azure Oryx will run npm install on the server
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "web.config" \
            -x "*.md" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "*.test.js"
          
          echo "✅ Deployment package created (excludes node_modules)"
          ls -lh ../backend.zip

      - name: 'Azure Login'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Stabilize SCM before deploy'
        run: |
          echo "Waiting briefly to avoid SCM restart/deploy overlap..."
          sleep 45

      - name: 'Deploy to Azure Web App (attempt 1)'
        uses: azure/webapps-deploy@v3
        id: deploy_1
        continue-on-error: true
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: backend.zip
          clean: true

      - name: 'Wait before retry (60s)'
        if: steps.deploy_1.outcome == 'failure'
        run: |
          echo "Deployment failed, waiting 60 seconds before retry..."
          sleep 60

      - name: 'Deploy to Azure Web App (attempt 2)'
        if: steps.deploy_1.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        id: deploy_2
        continue-on-error: true
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: backend.zip
          clean: true

      - name: 'Wait before retry (120s)'
        if: steps.deploy_2.outcome == 'failure'
        run: |
          echo "Deployment failed again, waiting 120 seconds before final retry..."
          sleep 120

      - name: 'Deploy to Azure Web App (attempt 3)'
        if: steps.deploy_2.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        id: deploy_3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: backend.zip
          clean: true

      - name: 'Wait for Azure Oryx build and startup'
        if: always()
        run: |
          echo "⏳ Waiting for Azure to build dependencies and start app..."
          echo "   Azure Oryx will run: npm install --production"
          echo "   This typically takes 3-5 minutes"
          sleep 180

      - name: 'Resolve backend hostname'
        if: always()
        id: resolve_host
        run: |
          DEFAULT_HOST=$(az webapp show \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group $(az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --query resourceGroup -o tsv) \
            --query defaultHostName -o tsv)

          echo "default_host=$DEFAULT_HOST" >> "$GITHUB_OUTPUT"
          echo "Resolved default host: $DEFAULT_HOST"

      - name: 'Verify deployment'
        if: always()
        run: |
          echo "🔍 Testing health endpoint(s)..."

          declare -a HOSTS
          HOSTS+=("${{ steps.resolve_host.outputs.default_host }}")
          HOSTS+=("${{ env.AZURE_WEBAPP_NAME }}-g9cna3ath2b4h8br.centralindia-01.azurewebsites.net")

          for host in "${HOSTS[@]}"; do
            if [ -z "$host" ]; then
              continue
            fi

            echo "Checking host: $host"
            for i in {1..6}; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$host/api/health")
              if [ "$CODE" = "200" ]; then
                echo "✅ Backend is healthy on https://$host/api/health"
                exit 0
              fi
              echo "Attempt $i/6 on $host returned HTTP $CODE, waiting 30s..."
              sleep 30
            fi
          done

          echo "❌ Health check failed for all candidate hosts"
          for host in "${HOSTS[@]}"; do
            if [ -n "$host" ]; then
              echo "--- Diagnostics for $host ---"
              curl -I -s "https://$host/api/health" || true
              curl -I -s "https://$host/" || true
            fi
          done

          exit 1


